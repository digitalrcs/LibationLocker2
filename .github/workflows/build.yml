name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build application
        run: dotnet build src/LibationLocker.Web/LibationLocker.Web.csproj --configuration Release
      - name: Check application JavaScript
        shell: pwsh
        run: |
          Get-ChildItem src/LibationLocker.Web/wwwroot/js/*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $($_.Name)" }
          }
      - name: Audit source package
        shell: pwsh
        run: ./scripts/New-GitHubPackage.ps1 -Version ci
